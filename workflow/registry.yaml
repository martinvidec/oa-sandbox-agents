# Registry der Workflow-DSL-Instanzen. Jeder Eintrag benennt einen Workflow unter
# `workflow/<id>/` (die vier Dateien roles.yaml, states.yaml, rules.yaml, pipeline.yaml) mit
# einer Beschreibung und dem Aktiv-Flag. Genau EIN Eintrag trägt `active: true` — der Loader
# von scripts/validate-workflow.mjs und scripts/render-workflow.mjs lädt ausschließlich diese
# Instanz; WORKFLOW.md und der aktiv-Block in AGENTS.md werden aus ihr generiert.
#
# Geprüft von scripts/validate-workflow.mjs (Schema + Registry-Invarianten):
#   - IDs sind slug-förmig (`^[a-z][a-z0-9]*(-[a-z0-9]+)*$`) und eindeutig
#   - genau ein `active: true`
#   - jede Instanz hat alle vier DSL-Dateien
#
# Der zweite Eintrag (`hermes-pipeline`) ist der Claude-Limit-Fallback (Issue #58): identische
# Pipeline, aber Coder- und Reviewer-Rolle laufen als Hermes-Sub-Agenten (delegate_task). Der
# Wechsel ist eine Switch-Prozedur — docs/workflow.md, „Workflow-Wechsel".
version: 1
source: "AGENTS.md — aktiver Workflow; research/multi-workflow-dsl"

workflows:
  - id: claude-pipeline
    description: "Claude-Code-Pipeline: Lead delegiert Coder-, Reviewer- und Sync-Runs als headless Claude-Code-Runs in eigenen Worktrees."
    active: true
  - id: hermes-pipeline
    description: "Hermes-Pipeline (Claude-Limit-Fallback): wie claude-pipeline, aber Coder- und Reviewer-Rolle laufen als Hermes-Sub-Agenten (delegate_task, Lead-delegiert, isolierter Kontext) statt als headless Claude-Code-Runs."
    active: false

name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md und CLAUDE.md vorhanden
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
      - name: YAML-Validierung (Templates + Workflows)
        run: |
          python3 - <<'PYEOF'
          import glob, sys
          import yaml
          bad = []
          for pattern in ("ISSUE_TEMPLATE/*.yml", "workflows/*.yml"):
              for p in glob.glob(".github/" + pattern):
                  try:
                      yaml.safe_load(open(p))
                  except Exception as e:
                      bad.append("%s: %s" % (p, e))
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("YAML OK")
          PYEOF

  workflow-dsl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Abhängigkeiten außerhalb des Checkouts — im Repo-Root sind node_modules/ und
      # package.json nicht gitignored (AGENTS.md D2, „Warum Playwright nicht im Repo-Root
      # installiert wird"). Gefunden werden sie über NODE_PATH, wie bei verify-mermaid.mjs.
      - name: Validator-Abhängigkeiten außerhalb des Repos installieren
        run: |
          mkdir -p "$RUNNER_TEMP/oa-validate"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/oa-validate" ajv@^8 js-yaml@^4
      - name: Workflow-DSL validieren (Schema, Wildcard-Sicherheitsanalyse, Zustandsmaschine)
        env:
          NODE_PATH: ${{ runner.temp }}/oa-validate/node_modules
        run: node scripts/validate-workflow.mjs
      - name: AGENTS.md-Tabellen gegen die DSL prüfen (generiert == eingecheckt)
        env:
          NODE_PATH: ${{ runner.temp }}/oa-validate/node_modules
        run: node scripts/render-agents.mjs --check
